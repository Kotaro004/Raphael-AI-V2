name: Raphael security tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "audit/**"]

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raphael
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: |
            raphael/requirements.lock
            raphael/requirements.in
      - name: Install pinned lock compiler
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-tools==7.7.0"
      - name: Regenerate hash-locked dependencies
        run: |
          pip-compile --no-config --resolver=backtracking --generate-hashes --allow-unsafe --no-emit-index-url --output-file=requirements.lock requirements.in
      - name: Install hash-verified dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run security tests
        env:
          FLASK_SECRET_KEY: ci-only-secret-key-not-for-production
          RAPHAEL_USERNAME: ci-owner
          RAPHAEL_PASSWORD_HASH: "scrypt:32768:8:1$ci$invalid"
          RAPHAEL_COOKIE_SECURE: "false"
          RAPHAEL_ENV: development
          RAPHAEL_LIMITER_STORAGE: memory://
          RAPHAEL_DB_PATH: /tmp/raphael-ci.sqlite3
        run: pytest -q
      - name: Verify dependency lock is reproducible
        run: git diff --exit-code -- requirements.lock
